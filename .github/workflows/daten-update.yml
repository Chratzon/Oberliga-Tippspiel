name: Spielplan und Ergebnisse aktualisieren

# In Anführungszeichen, sonst liest YAML "on" als Wahrheitswert.
"on":
  schedule:
    # Spieltag: prüft nur die eigene Datei. hockeyweb wird erst gefragt,
    # wenn das letzte Spiel eines Tages seit 2 Std. 40 Min. läuft.
    - cron: '*/15 15-23 * * *'
    # Nachts: kompletter Spielplan (Verlegungen) und Nachzügler.
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Erkennung prüfen
        run: node scripts/test-parser.mjs

      - name: Daten holen
        run: |
          if [ "${{ github.event.schedule }}" = "*/15 15-23 * * *" ]; then
            node scripts/scrape.mjs --modus=spieltag
          else
            node scripts/scrape.mjs
          fi

      - name: Änderungen einchecken
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spielplan.json data/ergebnisse.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
